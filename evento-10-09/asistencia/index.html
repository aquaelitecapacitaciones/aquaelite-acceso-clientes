<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asistencia | Aquaelite</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f7fb;color:#102b46}.wrap{max-width:520px;margin:60px auto;padding:22px}.card{background:white;padding:30px;border-radius:20px;box-shadow:0 12px 35px rgba(16,43,70,.12)}.logo{background:#fff;margin-bottom:20px}.logo img{width:240px;max-width:70vw}.tag{font-size:13px;font-weight:700;color:#0878c9;text-transform:uppercase;letter-spacing:.8px}h1{font-size:28px;margin:8px 0 10px}p{color:#587086;line-height:1.55}label{display:block;font-weight:700;margin:22px 0 8px}input{width:100%;padding:15px;border:1px solid #ccd8e4;border-radius:12px;font-size:17px}.btn,.open{display:block;width:100%;border:0;border-radius:12px;padding:15px;margin-top:15px;background:#0878c9;color:white;font-weight:700;font-size:16px;text-align:center;text-decoration:none;cursor:pointer}.status{display:none;margin-top:18px;padding:16px;border-radius:12px;line-height:1.5}.ok{display:block;background:#eaf8ef;color:#17683a}.bad{display:block;background:#fff0f0;color:#9a3030}.note{font-size:13px;color:#7a8da0;margin-top:18px}</style></head><body><div class="wrap"><div class="card"><div class="logo"><img src="../../logo-aquaelite.png" alt="Aquaelite"></div><div class="tag">Encuentro 10/09</div><h1>Registra tu asistencia</h1><p>Ingresa el mismo WhatsApp con el que te inscribiste. Si tu número está registrado, tu asistencia quedará confirmada y habilitaremos tu AquaCheck gratuito.</p><label>WhatsApp</label><input id="wa" inputmode="numeric" placeholder="Ej. 999999999"><button id="btn" class="btn">CONFIRMAR MI ASISTENCIA</button><div id="status" class="status"></div><p class="note">El acceso se habilita únicamente para números previamente inscritos al encuentro.</p></div></div><script>const API='https://script.google.com/macros/s/AKfycbyHyU1R_VfIGMlQknE4J9YVYihAgk_rBUSyHDx_mViZhrgLSaOXivB4Ptr4O3sFPbDkrQ/exec';const btn=document.getElementById('btn'),st=document.getElementById('status');function show(t,ok){st.className='status '+(ok?'ok':'bad');st.innerHTML=t}btn.onclick=async()=>{const whatsapp=document.getElementById('wa').value.trim();if(!whatsapp){show('Ingresa tu número de WhatsApp.',false);return}btn.disabled=true;btn.textContent='VALIDANDO...';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'confirmar_asistencia_10_09',whatsapp})});const d=await r.json();if(d.ok&&d.encontrado&&d.habilitado){show('✅ <b>¡Asistencia registrada!</b><br>Hola '+(d.nombre||'')+'. Tu AC-NEG-001 ya quedó habilitado.<br><br>En el siguiente paso conectaremos aquí el botón para abrir directamente tu AquaCheck.',true)}else{show('🔒 '+(d.message||'No encontramos este WhatsApp entre los inscritos.'),false)}}catch(e){show('No pudimos validar tu asistencia en este momento.',false)}finally{btn.disabled=false;btn.textContent='CONFIRMAR MI ASISTENCIA'}};</script></body></html>
