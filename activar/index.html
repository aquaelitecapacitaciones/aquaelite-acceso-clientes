<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aquaelite | Activar compra</title>
<style>:root{--navy:#071827;--card:#0d263b;--line:#294b63;--muted:#a9bfce;--red:#ff9a9a}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 20% 0,#123c59,transparent 35%),var(--navy);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(100%,540px);background:var(--card);border:1px solid rgba(255,255,255,.11);border-radius:20px;padding:32px;box-shadow:0 24px 55px rgba(0,0,0,.28)}.logo{background:#fff;border-radius:12px;padding:11px 17px;width:min(100%,320px);margin:0 auto 20px}.logo img{display:block;width:100%}.center{text-align:center}.badge{display:inline-block;padding:7px 13px;border-radius:30px;background:#123f5b;color:#cbedff;font-size:12px}h1{font-size:28px;margin:17px 0 8px}.lead{color:var(--muted);line-height:1.55;margin-bottom:23px}label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;background:#071c2b;color:#fff;font-size:15px;margin-bottom:15px}button,.button{display:block;width:100%;padding:14px;border:0;border-radius:9px;background:linear-gradient(90deg,#168dca,#13b8de);color:#fff;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer}.check{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:12px;line-height:1.4;margin-bottom:18px}.check input{width:auto;margin:2px 0}.message{display:none;margin-top:15px;padding:12px;border-radius:8px;font-size:13px;line-height:1.5}.message.error{display:block;background:rgba(220,60,60,.15);color:var(--red)}.message.success{display:block;background:rgba(30,190,100,.14);color:#86e7b3}.hidden{display:none}.footer{text-align:center;color:#668399;font-size:11px;margin-top:20px}</style></head>
<body><main class="card"><div class="center"><div class="logo"><img src="../logo-aquaelite.png" alt="Aquaelite"></div><span class="badge">✓ ACTIVACIÓN DE COMPRA</span><h1>Activa tus herramientas</h1><p class="lead">Registra una sola vez los datos del titular. Este correo será el que usarás para recibir tus códigos de ingreso.</p></div>
<form id="form"><label for="name">Nombre y apellido</label><input id="name" autocomplete="name" required placeholder="Nombre del titular"><label for="whatsapp">WhatsApp</label><input id="whatsapp" inputmode="tel" autocomplete="tel" required placeholder="999 999 999"><label for="email">Correo de acceso</label><input id="email" type="email" autocomplete="email" required placeholder="correo@ejemplo.com"><label class="check"><input id="consent" type="checkbox" required><span>Confirmo que estos datos pertenecen al titular de la compra y autorizo su uso para administrar el acceso Aquaelite.</span></label><button id="activate" type="submit">ACTIVAR MI ACCESO</button></form><div id="msg" class="message"></div><a id="portal" class="button hidden" href="../">INGRESAR A MIS HERRAMIENTAS</a><div class="footer">El enlace de activación se utiliza una sola vez.</div></main>
<script>
const API='https://script.google.com/macros/s/AKfycbxQJ5cUTRR_6MAlIvTR4mgCfcI-wK3IaEm3_4EMXrY2hKCzohBkHoynrWxBMlp3lpIT/exec',token=new URLSearchParams(location.search).get('token')||'';const $=id=>document.getElementById(id);
function api(action,params={}){return new Promise((resolve,reject)=>{const cb='aqb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),s=document.createElement('script');let done=false;const finish=()=>{if(done)return;done=true;delete window[cb];s.remove()};const timer=setTimeout(()=>{finish();reject(new Error('timeout'))},18000);window[cb]=r=>{clearTimeout(timer);finish();resolve(r)};s.src=API+'?'+new URLSearchParams({action,callback:cb,...params});s.onerror=()=>{clearTimeout(timer);finish();reject(new Error('network'))};document.body.appendChild(s)})}
function msg(text,type){$('msg').textContent=text;$('msg').className='message '+type}
if(!token){msg('Este enlace de activación no es válido. Solicita uno nuevo a Aquaelite.','error');$('form').classList.add('hidden')}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('activate').disabled=true;$('activate').textContent='ACTIVANDO...';try{const r=await api('activate_purchase',{activation_token:token,nombre:$('name').value.trim(),whatsapp:$('whatsapp').value.trim(),correo:$('email').value.trim().toLowerCase()});if(r?.ok){$('form').classList.add('hidden');$('portal').classList.remove('hidden');msg('Listo. Tu acceso a '+r.product+' quedó habilitado y enviamos la confirmación a tu correo.','success')}else msg(r?.message||'No se pudo activar el acceso.','error')}catch{msg('No pudimos conectar con el sistema. Intenta nuevamente.','error')}finally{$('activate').disabled=false;$('activate').textContent='ACTIVAR MI ACCESO'}});
</script></body></html>
